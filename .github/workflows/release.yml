name: Build and Release AirDiary

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Rename and Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirDiary-android.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    name: Build macOS DMG/App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Archive macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r AirDiary-macos.zip AirDiary.app
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirDiary-macos.zip
          path: build/macos/Build/Products/Release/AirDiary-macos.zip

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Archive Windows Release
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath AirDiary-windows.zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirDiary-windows.zip
          path: AirDiary-windows.zip

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/AirDiary-android.apk/app-release.apk
            release-assets/AirDiary-macos.zip/AirDiary-macos.zip
            release-assets/AirDiary-windows.zip/AirDiary-windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
